# 楽天ブックスの価格・レビューを取り直して、GitHub Pages に公開する
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * 0" # 毎週月曜 6:00（日本時間）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 楽天ブックスから最新情報を取得
        # 失敗してもリポジトリにある data/books.json で公開を続ける
        continue-on-error: true
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_REFERER: https://kenu2004.github.io/
        run: python scripts/fetch_books.py
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
